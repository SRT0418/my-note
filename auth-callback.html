<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メール確認中... - MyNote</title>
    <link rel="stylesheet" href="./css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-client.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .callback-card { padding: 2rem; max-width: 400px; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #6c8cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #callback-message { margin-top: 1rem; font-size: 1rem; }
        .error-text { color: #f87171; }
        .success-text { color: #4ade80; }
    </style>
</head>

<body>
    <div class="callback-card">
        <div class="spinner" id="spinner"></div>
        <p id="callback-message">メールアドレスを確認しています...</p>
    </div>

    <script>
        (async () => {
            const msgEl = document.getElementById("callback-message");
            const spinner = document.getElementById("spinner");

            try {
                const client = window.MyNoteSupabase && window.MyNoteSupabase.isConfigured()
                    ? window.MyNoteSupabase.getClient()
                    : null;

                if (!client) throw new Error("Supabase が設定されていません。");

                // エラーパラメータの確認（ハッシュ / クエリ両対応）
                const hashParams = new URLSearchParams(window.location.hash.replace("#", "?"));
                const searchParams = new URLSearchParams(window.location.search);

                const errorCode = hashParams.get("error_code") || searchParams.get("error_code");
                const errorDesc = hashParams.get("error_description") || searchParams.get("error_description");
                if (errorCode) throw new Error(decodeURIComponent(errorDesc || errorCode).replace(/\+/g, " "));

                // --- パターン1: access_token がハッシュに含まれる旧フロー ---
                const accessToken = hashParams.get("access_token");
                const refreshToken = hashParams.get("refresh_token");

                if (accessToken && refreshToken) {
                    const { error } = await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                    if (error) throw error;
                    spinner.style.display = "none";
                    msgEl.className = "success-text";
                    msgEl.textContent = "✅ メールアドレスの確認が完了しました！ログインページへ移動します...";
                    await client.auth.signOut();
                    setTimeout(() => { location.href = "login.html"; }, 1500);
                    return;
                }

                // --- パターン2: code がクエリに含まれる PKCE フロー ---
                const code = searchParams.get("code");
                if (code) {
                    const { error } = await client.auth.exchangeCodeForSession(code);
                    if (error) throw error;
                    spinner.style.display = "none";
                    msgEl.className = "success-text";
                    msgEl.textContent = "✅ メールアドレスの確認が完了しました！ホームへ移動します...";
                    setTimeout(() => { location.href = "index.html"; }, 1500);
                    return;
                }

                throw new Error("確認トークンが見つかりませんでした。");

            } catch (e) {
                if (spinner) spinner.style.display = "none";
                msgEl.className = "error-text";
                msgEl.textContent = "❌ " + (e.message || "確認に失敗しました。");
                setTimeout(() => { location.href = "login.html"; }, 3000);
            }
        })();
    </script>
</body>

</html>
