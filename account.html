<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント設定</title>
    <link rel="stylesheet" href="./css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-client.js"></script>
    <script src="./js/db-sync.js"></script>
    <script src="./js/features.js"></script>
    <script src="./js/auth.js"></script>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body class="add">

    <h1>アカウント設定</h1>

    <div id="account-page-center">

        <div class="account-section">
            <h2>ログイン中のユーザー</h2>
            <p id="account-current-user" class="card"></p>
            <button id="logout-button">ログアウト</button>
            <button id="back-button">HOMEへ戻る</button>
        </div>

        <!-- 機能カスタマイズセクション -->
        <div class="account-section">
            <h2>⚙️ 機能のカスタマイズ</h2>
            <p style="color: #64748b; font-size: 13.5px; margin-bottom: 12px;">
                ホーム画面やメニューに表示する機能を自由に選択・変更できます。
            </p>
            <div id="account-current-features-preview" class="account-features-preview">
                <!-- 有効機能バッジをJSで表示 -->
            </div>
            <button id="btn-go-customize" class="btn-primary" style="margin-top: 10px; width: 100%; font-weight: bold; background: linear-gradient(135deg, #0284c7, #2563eb);">
                🛠️ 機能カスタマイズ画面を開く
            </button>
        </div>

        <div class="account-section">
            <h2>メールアドレスの変更</h2>
            <label for="new-email">メールアドレス：</label><br>
            <input id="new-email" type="email" placeholder="例：taro@example.com"><br><br>

            <button id="change-email-button">メールアドレスを変更</button>
            <p id="change-email-message" class="auth-message"></p>
        </div>

        <div class="account-section">
            <h2>パスワードの変更</h2>
            <label for="current-password">現在のパスワード：</label><br>
            <input id="current-password" type="password" placeholder="現在のパスワード"><br><br>

            <label for="new-password">新しいパスワード：</label><br>
            <input id="new-password" type="password" placeholder="新しいパスワード（4文字以上）"><br><br>

            <label for="new-password2">新しいパスワード（確認）：</label><br>
            <input id="new-password2" type="password" placeholder="もう一度入力"><br><br>

            <button id="change-password-button">パスワードを変更</button>
            <p id="change-password-message" class="auth-message"></p>
        </div>

        <!-- アカウント削除依頼セクション -->
        <div class="account-section">
            <h2>アカウントの削除</h2>
            <div class="danger-zone">
                <p>アカウント削除はマスター（管理者）のみ実行できます。<br>
                   削除を希望する場合は、下記フォームから削除願いを送信してください。<br>
                   受付後、登録メールアドレス宛に確認メールが届きます。</p>

                <!-- 既に申請済みの場合に表示 -->
                <div id="delete-request-already" class="delete-request-already" style="display:none;">
                    <span class="delete-req-icon">📋</span>
                    <div>
                        <strong>削除依頼を受付済みです</strong><br>
                        <span id="delete-request-already-date"></span>
                    </div>
                </div>

                <!-- 削除願いフォーム -->
                <div id="delete-request-form-wrap">
                    <div class="delete-request-form">
                        <div class="form-group">
                            <label for="delete-reason">削除の理由（任意）</label>
                            <textarea id="delete-reason" rows="3" placeholder="退会理由をご記入ください（任意）"></textarea>
                        </div>
                        <button id="send-delete-request-button" class="delete-button send-delete-btn">
                            📨 マスターへ削除願いを送る
                        </button>
                        <p id="delete-request-message" class="auth-message"></p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="./js/account-page.js" defer></script>

</body>

</html>
