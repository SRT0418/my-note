<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyNote — システム関係図マップ (Architecture Diagram)</title>
    <link rel="icon" href="./MyNote.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════
           MyNote Interactive Network Diagram (Lucidchart Inspired)
           Features: Draggable nodes, SVG dynamic arrows, Canvas pan/zoom
        ═══════════════════════════════════════════════════════════ */

        :root {
            --bg-canvas: #f8fafc;
            --grid-dot: #cbd5e1;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --card-bg: #ffffff;
            --border-card: #e2e8f0;
            --shadow-card: 0 4px 12px rgba(15, 23, 42, 0.08);

            /* Branch Colors (matching Lucidchart palette) */
            --color-core: #2563eb;
            --color-habit: #dc2626;
            --color-kadai: #ea580c;
            --color-task: #ca8a04;
            --color-sync: #059669;
            --color-calendar: #0284c7;
            --color-report: #7c3aed;
            --color-notify: #db2777;
            --color-storage: #0d9488;
        }

        [data-theme="dark"] {
            --bg-canvas: #0b0f19;
            --grid-dot: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --card-bg: #131b2e;
            --border-card: #1e293b;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: var(--bg-canvas);
            color: var(--text-main);
            transition: background 0.3s ease;
        }

        /* ── Top Toolbar (Lucidchart-like Header) ── */
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .toolbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 900;
            font-size: 14px;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-sub);
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-card);
            background: var(--card-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
            background: rgba(37, 99, 235, 0.05);
        }

        .tool-btn.primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #1d4ed8;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        .tool-btn.primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* ── Canvas Workspace ── */
        .workspace {
            position: absolute;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background-color: var(--bg-canvas);
            background-image: radial-gradient(var(--grid-dot) 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            cursor: grab;
        }

        .workspace.panning {
            cursor: grabbing;
        }

        .canvas-world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            will-change: transform;
        }

        /* ── SVG Connector Lines Layer ── */
        .svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .connector-line {
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .connector-pulse {
            stroke-dasharray: 6 6;
            animation: dashPulse 2s linear infinite;
        }

        @keyframes dashPulse {
            to { stroke-dashoffset: -24; }
        }

        /* ── Lucidchart-Style Box Nodes ── */
        .node {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-card);
            cursor: move;
            z-index: 10;
            transition: box-shadow 0.2s ease, transform 0.15s ease;
            white-space: nowrap;
            min-width: 160px;
        }

        .node:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 50;
            transform: scale(1.03);
        }

        .node.active {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.4), var(--shadow-card);
        }

        /* Node Avatar / Icon */
        .node-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.05);
            border: 2px solid currentColor;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .node-content {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .node-name {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        .node-role {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 2px;
        }

        .node-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9.5px;
            padding: 1px 6px;
            border-radius: 4px;
            margin-top: 4px;
            width: fit-content;
            font-weight: 600;
        }

        /* Specific Node Colors & Borders */
        .node-core {
            border: 2.5px solid var(--color-core);
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), var(--card-bg));
            padding: 14px 22px;
        }
        .node-core .node-avatar { color: var(--color-core); width: 44px; height: 44px; font-size: 22px; }
        .node-core .node-name { font-size: 15px; font-weight: 800; color: var(--color-core); }

        .node-habit { border: 2px solid var(--color-habit); }
        .node-habit .node-avatar { color: var(--color-habit); }

        .node-kadai { border: 2px solid var(--color-kadai); }
        .node-kadai .node-avatar { color: var(--color-kadai); }

        .node-task { border: 2px solid var(--color-task); }
        .node-task .node-avatar { color: var(--color-task); }

        .node-sync { border: 2px solid var(--color-sync); }
        .node-sync .node-avatar { color: var(--color-sync); }

        .node-calendar { border: 2px solid var(--color-calendar); }
        .node-calendar .node-avatar { color: var(--color-calendar); }

        .node-report { border: 2px solid var(--color-report); }
        .node-report .node-avatar { color: var(--color-report); }

        .node-notify { border: 2px solid var(--color-notify); }
        .node-notify .node-avatar { color: var(--color-notify); }

        .node-storage { border: 2px solid var(--color-storage); }
        .node-storage .node-avatar { color: var(--color-storage); }

        /* ── Floating Controls Bar (Zoom & Layout) ── */
        .floating-controls {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            padding: 6px;
            gap: 6px;
            z-index: 90;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #2563eb;
        }

        .zoom-label {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            padding: 0 8px;
            color: var(--text-sub);
        }

        /* ── Legend Sidebar (Collapsible) ── */
        .legend-card {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            padding: 14px 18px;
            z-index: 90;
            max-width: 260px;
            font-size: 12px;
        }

        .legend-title {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            font-size: 11px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Detail Modal / Flyout ── */
        .detail-modal {
            position: fixed;
            top: 76px;
            right: 24px;
            width: 360px;
            max-height: calc(100vh - 120px);
            background: var(--card-bg);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
            z-index: 110;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideInRight 0.25s ease;
        }

        .detail-modal.open {
            display: flex;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-sub);
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-body {
            padding: 18px 20px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .code-snippet {
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            border: 1px solid var(--border-card);
            overflow-x: auto;
        }

        /* ── Launch Burst Animation ── */
        .node.burst-in {
            animation: burstPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes burstPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ── Mobile & Tablet Responsive Styles ── */
        @media (max-width: 768px) {
            .toolbar {
                height: auto;
                min-height: 50px;
                padding: 8px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .toolbar-brand {
                justify-content: space-between;
                width: 100%;
            }

            .brand-subtitle {
                display: none;
            }

            .toolbar-actions {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 2px;
                gap: 6px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .toolbar-actions::-webkit-scrollbar {
                display: none;
            }

            .tool-btn {
                padding: 6px 11px;
                font-size: 11px;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .workspace {
                top: 92px; /* dynamically accounts for two-row mobile toolbar */
            }

            /* Floating zoom controls */
            .floating-controls {
                bottom: 14px;
                right: 12px;
                padding: 4px;
                gap: 3px;
                border-radius: 10px;
            }

            .icon-btn {
                width: 32px;
                height: 32px;
                font-size: 15px;
            }

            .zoom-label {
                font-size: 10px;
                padding: 0 4px;
            }

            /* Legend Card mobile collapse */
            .legend-card {
                bottom: 14px;
                left: 12px;
                padding: 8px 12px;
                max-width: 170px;
                border-radius: 10px;
                cursor: pointer;
            }

            .legend-card.collapsed .legend-items {
                display: none;
            }

            .legend-title {
                margin-bottom: 0;
                font-size: 11px;
                user-select: none;
            }

            .legend-card:not(.collapsed) .legend-title {
                margin-bottom: 8px;
            }

            /* Bottom sheet style for detail modal on mobile */
            .detail-modal {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-height: 75vh;
                border-radius: 20px 20px 0 0;
                box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.35);
                animation: slideUpSheet 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            }

            @keyframes slideUpSheet {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }

            .modal-head {
                padding: 14px 18px;
            }

            .modal-body {
                padding: 14px 18px 24px;
                gap: 12px;
            }
        }

        /* Modal backdrop for mobile */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 105;
        }

        .modal-backdrop.open {
            display: block;
        }

        /* ═══ v2: 詳細放射レイアウト / 線の入場アニメ / スマホ最適化 ═══ */
        :root { --color-wish: #c026d3; --color-ui: #4f46e5; }
        html, body { height: 100%; width: 100%; }
        body { display: flex; flex-direction: column; height: 100dvh; }
        .toolbar { position: relative; flex: none; padding-top: env(safe-area-inset-top); }
        .workspace { position: relative; top: auto; flex: 1; min-height: 0; touch-action: none; }
        .node-wish { border: 2px solid var(--color-wish); } .node-wish .node-avatar { color: var(--color-wish); }
        .node-ui { border: 2px solid var(--color-ui); } .node-ui .node-avatar { color: var(--color-ui); }
        .node { transform: translate(-50%, -50%); min-width: 0; padding: 6px 10px; gap: 8px; overflow: hidden; touch-action: none; }
        .node:hover { transform: translate(-50%, -50%) scale(1.05); }
        .node-content { min-width: 0; }
        .node-name, .node-role { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .node.lv0 { width: 230px; height: 66px; padding: 8px 16px; }
        .node.lv1 { width: 190px; height: 56px; }
        .node.lv2 { width: 150px; height: 46px; padding: 5px 8px; gap: 6px; }
        .node.lv3 { width: 140px; height: 40px; padding: 4px 8px; gap: 6px; border-style: dashed !important; border-width: 1.5px !important; }
        .lv2 .node-avatar { width: 28px; height: 28px; font-size: 14px; border-width: 1.5px; }
        .lv3 .node-avatar { width: 24px; height: 24px; font-size: 12px; border-width: 1.5px; }
        .lv2 .node-name { font-size: 12px; } .lv3 .node-name { font-size: 11px; }
        .lv2 .node-role, .lv3 .node-role { font-size: 9.5px; margin-top: 0; }
        .ring { fill: none; stroke: var(--grid-dot); stroke-width: 1.2; stroke-dasharray: 4 9; opacity: .8; }
        .connector-line { stroke-width: 2; }
        .connector-line.link { stroke-width: 1.4; stroke-dasharray: 3 6; opacity: .55; }
        .nolinks .link { display: none; }
        .pulsing .connector-line:not(.play):not(.link) { stroke-dasharray: 6 6; animation: dashPulse 2s linear infinite; }
        .node.play { animation: popIn .5s cubic-bezier(.175, .885, .32, 1.275) var(--d, 0s) both; }
        .ring.play { animation: fadeRing .8s ease var(--d, 0s) both; }
        .connector-line.play { stroke-dasharray: var(--len) !important; animation: drawLine .7s ease-out var(--d, 0s) both !important; }
        @keyframes popIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.4); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes drawLine { from { stroke-dashoffset: var(--len); opacity: 0; } 8% { opacity: 1; } to { stroke-dashoffset: 0; } }
        @keyframes fadeRing { from { opacity: 0; } to { opacity: .8; } }
        .legend-title { white-space: nowrap; }
        @media (max-width: 768px) {
            .toolbar { padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
            .workspace { top: auto; }
            .tool-btn { min-height: 38px; }
            .floating-controls { bottom: max(14px, env(safe-area-inset-bottom)); right: max(12px, env(safe-area-inset-right)); }
            .legend-card { bottom: max(14px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); }
            .detail-modal { max-height: 70dvh; padding-bottom: env(safe-area-inset-bottom); }
            .icon-btn { width: 40px; height: 40px; }
        }
    </style>
</head>

<body>

    <!-- ── Top Lucidchart-Style Toolbar ── -->
    <header class="toolbar">
        <div class="toolbar-brand">
            <div class="brand-icon">MN</div>
            <div class="brand-info">
                <span class="brand-title">MyNote システム全体関係図</span>
                <span class="brand-subtitle">Interactive Architecture Mindmap</span>
            </div>
        </div>

        <div class="toolbar-actions">
            <button id="btn-burst" class="tool-btn primary" onclick="animateRadialBurst()">
                <span>🚀 相関図を展開</span>
            </button>
            <button class="tool-btn" onclick="resetNodePositions()">
                <span>🔄 位置を整列</span>
            </button>
            <button class="tool-btn" onclick="toggleLinks()">
                <span>🔗 連携線</span>
            </button>
            <button class="tool-btn" onclick="togglePulse()">
                <span>⚡ データフロー演出</span>
            </button>
            <button class="tool-btn" onclick="toggleTheme()">
                <span id="theme-icon">🌙 ダーク切替</span>
            </button>
            <a href="algorithm.html" class="tool-btn">
                <span>🧠 アルゴリズム詳細</span>
            </a>
            <a href="index.html" class="tool-btn">
                <span>🏠 ホーム</span>
            </a>
        </div>
    </header>

    <!-- ── Interactive Canvas Workspace ── -->
    <div id="workspace" class="workspace">
        <div id="canvas-world" class="canvas-world">
            <!-- SVG Connectors Layer -->
            <svg id="svg-layer" class="svg-layer">
                <defs>
                    <!-- Marker for line arrows -->
                    <marker id="arrow-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-core)" />
                    </marker>
                    <marker id="arrow-habit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-habit)" />
                    </marker>
                    <marker id="arrow-kadai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-kadai)" />
                    </marker>
                    <marker id="arrow-task" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-task)" />
                    </marker>
                    <marker id="arrow-sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-sync)" />
                    </marker>
                    <marker id="arrow-calendar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-calendar)" />
                    </marker>
                    <marker id="arrow-report" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

        A('leaf-wish-purge','30日パージ','purgeOldDeletedWishes','🧹','wish','sub-wish-trash','30日以上経過した削除済みを自動で完全削除。','js/wishlist.js','purgeOldDeletedWishes();');
        A('sub-idea','アイデア保存','ideas.js','💡','wish','branch-wish','思いついたメモを即時に永続化。','js/ideas.js','saveIdeas(list);');
        A('leaf-idea-done','達成化','setIdeaAchieved()','🏁','wish','sub-idea','実現したアイデアを達成済みへ移す。','js/ideas.js','setIdeaAchieved(id);');
        A('leaf-idea-restore','アーカイブ復元','restoreIdea()','📤','wish','sub-idea','削除済みアイデアを元に戻す。','js/ideas.js','restoreIdea(id);');
        A('sub-ui-drawer','ドロワー','openDrawer / closeDrawer','☰','ui','branch-ui','スマホ・PC共通のスライドメニュー。','js/common.js','openDrawer();');
        A('sub-ui-grid','カードグリッド','auto-fit minmax','🧱','ui','branch-ui','画面幅に応じて列数が変わるカード配置。','css/common.css','repeat(auto-fit, minmax(280px, 1fr))');
        A('sub-ui-egg','隠しコマンド','Konami / algo','🥚','ui','branch-ui','特定のキー入力で隠しページへワープ。','index.html','if (e.key === SECRET[idx]) idx++;');
        A('sub-ui-custom','カスタマイズ','customize.js','🎛️','ui','branch-ui','表示や機能のON/OFFを切り替える設定。','js/customize.js','applyCustomize();');
        A('leaf-algo','algorithm.html','隠しページ','🌌','ui','sub-ui-egg','ワープ演出のあと本ページへ遷移。','algorithm.html','location.href = "algorithm.html";');
        // 横断リンク（モジュール間のデータ連携）
        const LINKS = [['branch-notify','branch-kadai'],['branch-notify','branch-habit'],['branch-notify','sub-bday'],['branch-report','branch-kadai'],['branch-report','branch-task'],['branch-report','branch-calendar'],['branch-calendar','branch-kadai'],['sub-bus','sub-pull'],['sub-keys','sub-push'],['branch-ui','branch-notify']];

        // ═════════ Diagram Engine: 放射レイアウト / 線の描画アニメ / Pointer操作 ═════════
        const R = [0, 215, 430, 620], SX = 1.85, SZ = [[230,66],[190,56],[150,46],[140,40]], PAD = 160;
        const TYPE_COLORS = { core:'var(--color-core)', habit:'var(--color-habit)', kadai:'var(--color-kadai)', task:'var(--color-task)', sync:'var(--color-sync)', calendar:'var(--color-calendar)', report:'var(--color-report)', notify:'var(--color-notify)', storage:'var(--color-storage)', wish:'var(--color-wish)', ui:'var(--color-ui)', x:'var(--text-sub)' };
        let scale = 1, panX = 0, panY = 0, W = 0, H = 0, edges = [], animT = null, playing = false;
        const ptrs = new Map(); let drag = null, pan = null, pinch = null;
        const workspace = document.getElementById('workspace'), world = document.getElementById('canvas-world'),
              svgLayer = document.getElementById('svg-layer'), nodesContainer = document.getElementById('nodes-container');
        const byId = id => NODES_DATA.find(n => n.id === id);
        const SVGNS = 'http://www.w3.org/2000/svg';

        function layout() {
            const by = {}; NODES_DATA.forEach(n => (by[n.parent || ''] = by[n.parent || ''] || []).push(n));
            const wt = n => (by[n.id] || []).reduce((s, c) => s + wt(c), 0) || 1;
            let k = 0;
            const place = (n, s, e, lv) => {
                n.lv = lv; const m = (s + e) / 2, r = R[lv] + (lv > 1 ? (k++ % 2 ? 28 : -28) : 0);
                n.x = Math.cos(m) * r * SX; n.y = Math.sin(m) * r;
                let t = s; const tot = wt(n);
                (by[n.id] || []).forEach(c => { const w = (e - s) * wt(c) / tot; place(c, t, t + w, lv + 1); t += w; });
            };
            place(byId('core'), -Math.PI / 2, Math.PI * 1.5, 0);
            const xs = NODES_DATA.map(n => n.x), ys = NODES_DATA.map(n => n.y);
            const ox = PAD - Math.min(...xs), oy = PAD - Math.min(...ys);
            NODES_DATA.forEach(n => { n.x += ox; n.y += oy; });
            W = Math.max(...xs) + ox + PAD; H = Math.max(...ys) + oy + PAD;
        }
        const setPos = n => { const el = document.getElementById('node-' + n.id); if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; } };

        function renderNodes() {
            layout(); nodesContainer.innerHTML = '';
            NODES_DATA.forEach(n => {
                const el = document.createElement('div');
                el.className = `node node-${n.type} lv${n.lv}`; el.id = 'node-' + n.id; el.dataset.id = n.id;
                el.innerHTML = `<div class="node-avatar">${n.avatar}</div><div class="node-content"><span class="node-name">${n.name}</span><span class="node-role">${n.role}</span></div>`;
                nodesContainer.appendChild(el); setPos(n);
            });
            world.style.width = W + 'px'; world.style.height = H + 'px';
            svgLayer.setAttribute('width', W); svgLayer.setAttribute('height', H);
            buildLines();
        }

        function buildLines() {
            svgLayer.innerHTML = ''; edges = [];
            const c = byId('core');
            [1, 2, 3].forEach(i => {
                const g = document.createElementNS(SVGNS, 'ellipse');
                g.setAttribute('class', 'ring'); g.setAttribute('cx', c.x); g.setAttribute('cy', c.y);
                g.setAttribute('rx', R[i] * SX); g.setAttribute('ry', R[i]); svgLayer.appendChild(g);
            });
            const mk = (a, b, link) => {
                const p = document.createElementNS(SVGNS, 'path');
                p.setAttribute('class', 'connector-line' + (link ? ' link' : ''));
                p.setAttribute('stroke', TYPE_COLORS[link ? 'x' : b.type]);
                svgLayer.appendChild(p); edges.push({ a, b, p, link });
            };
            NODES_DATA.forEach(n => n.parent && mk(byId(n.parent), n, false));
            LINKS.forEach(([a, b]) => mk(byId(a), byId(b), true));
            updateConnectors(true);
        }
        function clip(n, o) {
            const [w, h] = SZ[n.lv], dx = o.x - n.x, dy = o.y - n.y;
            const t = Math.min((w / 2 + 4) / Math.abs(dx || 1e-6), (h / 2 + 4) / Math.abs(dy || 1e-6), 0.5);
            return [n.x + dx * t, n.y + dy * t];
        }
        function updateConnectors(measure) {
            edges.forEach(({ a, b, p }) => {
                const [s0, s1] = clip(a, b), [e0, e1] = clip(b, a), dx = e0 - s0, dy = e1 - s1;
                p.setAttribute('d', `M${s0} ${s1}Q${(s0 + e0) / 2 - dy * .08} ${(s1 + e1) / 2 + dx * .08} ${e0} ${e1}`);
                if (measure) p.style.setProperty('--len', Math.ceil(p.getTotalLength()) + 'px');
            });
        }

        // ── ページ入場アニメ: 中心から放射状に「線が伸びる → ノードが現れる」を階層ごとに連鎖
        function animateRadialBurst() {
            clearTimeout(animT);
            const all = [...nodesContainer.children, ...svgLayer.querySelectorAll('.connector-line, .ring')];
            all.forEach(e => e.classList.remove('play')); void world.offsetWidth;
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            playing = true; let i = 0;
            const set = (e, d) => { e.style.setProperty('--d', d.toFixed(2) + 's'); e.classList.add('play'); };
            set(document.getElementById('node-core'), 0);
            svgLayer.querySelectorAll('.ring').forEach((r, k) => set(r, .2 + k * .6));
            edges.forEach(({ b, p, link }) => {
                const d = link ? 2.9 + (i++ % 10) * .08 : .25 + (b.lv - 1) * .6 + (i++ % 8) * .04;
                set(p, d); if (!link) set(document.getElementById('node-' + b.id), d + .55);
            });
            animT = setTimeout(() => { all.forEach(e => e.classList.remove('play')); playing = false; }, 4600);
        }

        // ── 入力: Pointer Events でマウス/タッチ/ピンチを一本化
        function toWorld(cx, cy) { const r = world.getBoundingClientRect(); return { x: (cx - r.left) / scale, y: (cy - r.top) / scale }; }
        function applyTransform() {
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
        }
        function zoomAt(cx, cy, ns) {
            ns = Math.min(Math.max(ns, .2), 2.2);
            const r = workspace.getBoundingClientRect(), mx = cx - r.left, my = cy - r.top;
            panX = mx - (mx - panX) * ns / scale; panY = my - (my - panY) * ns / scale; scale = ns; applyTransform();
        }
        workspace.addEventListener('pointerdown', e => {
            if (e.button > 0) return;
            ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
            try { workspace.setPointerCapture(e.pointerId); } catch (_) {}
            if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; drag = pan = null; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: scale }; return; }
            const nd = e.target.closest('.node');
            if (nd && !playing) { const n = byId(nd.dataset.id), w = toWorld(e.clientX, e.clientY); drag = { n, dx: n.x - w.x, dy: n.y - w.y, sx: e.clientX, sy: e.clientY, moved: false }; }
            else { pan = { x: e.clientX - panX, y: e.clientY - panY }; workspace.classList.add('panning'); }
        });
        workspace.addEventListener('pointermove', e => {
            if (!ptrs.has(e.pointerId)) return;
            ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
            if (drag) {
                if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
                drag.moved = true; const w = toWorld(e.clientX, e.clientY);
                drag.n.x = w.x + drag.dx; drag.n.y = w.y + drag.dy; setPos(drag.n); updateConnectors();
            } else if (pan) { panX = e.clientX - pan.x; panY = e.clientY - pan.y; applyTransform(); }
        });
        const endPtr = e => {
            if (!ptrs.delete(e.pointerId)) return;
            if (drag && !drag.moved && e.type === 'pointerup') openDetailModal(drag.n);
            if (ptrs.size < 2) pinch = null;
            if (!ptrs.size) { drag = pan = null; workspace.classList.remove('panning'); }
        };
        workspace.addEventListener('pointerup', endPtr); workspace.addEventListener('pointercancel', endPtr);
        workspace.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, scale * (e.deltaY < 0 ? 1.1 : .9)); }, { passive: false });

        // ── ボタン類
        function fitAll() {
            const w = workspace.clientWidth, h = workspace.clientHeight;
            scale = Math.min(w / W, h / H) * .97; panX = (w - W * scale) / 2; panY = (h - H * scale) / 2; applyTransform();
        }
        function resetZoomAndPan() {
            const w = workspace.clientWidth, h = workspace.clientHeight, c = byId('core');
            if (w < 768) { scale = .5; panX = w / 2 - c.x * scale; panY = h / 2 - c.y * scale; applyTransform(); } else fitAll();
        }
        function resetNodePositions() { layout(); NODES_DATA.forEach(setPos); buildLines(); }
        function zoomIn() { const r = workspace.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, scale * 1.2); }
        function zoomOut() { const r = workspace.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, scale / 1.2); }
        function togglePulse() { svgLayer.classList.toggle('pulsing'); }
        function toggleLinks() { svgLayer.classList.toggle('nolinks'); }
        function toggleLegend() { document.getElementById('legend-card').classList.toggle('collapsed'); }
        function toggleTheme() {
            const dark = document.body.getAttribute('data-theme') === 'dark';
            dark ? document.body.removeAttribute('data-theme') : document.body.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').textContent = dark ? '🌙 ダーク切替' : '☀️ ライト切替';
        }
        function openDetailModal(node) {
            document.getElementById('detail-modal-title').textContent = `${node.avatar} ${node.name}`;
            document.getElementById('detail-modal-desc').textContent = node.desc || 'モジュール概要';
            document.getElementById('detail-modal-file').textContent = `📄 ${node.file || 'N/A'}`;
            document.getElementById('detail-modal-code').textContent = node.code || '// 実装コード';
            document.getElementById('detail-modal').classList.add('open');
            document.getElementById('modal-backdrop').classList.add('open');
        }
        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('open');
            document.getElementById('modal-backdrop').classList.remove('open');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetailModal(); });
        window.addEventListener('DOMContentLoaded', () => { renderNodes(); resetZoomAndPan(); animateRadialBurst(); });
        window.addEventListener('resize', () => { if (!ptrs.size) resetZoomAndPan(); });
    </script>
